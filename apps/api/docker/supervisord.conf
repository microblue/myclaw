# Supervisord wraps the four long-running services that install-claw.sh
# drops as systemd units on a VM. Container has no systemd, so each
# program is a plain process here. On crash, supervisord restarts —
# matches `Restart=always` in the systemd units.

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
loglevel=info

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[program:caddy]
command=/usr/bin/caddy run --config /etc/caddy/Caddyfile
autorestart=true
startretries=10
stdout_logfile=/var/log/caddy.log
stderr_logfile=/var/log/caddy.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2

[program:node_exporter]
command=/opt/node_exporter/node_exporter --web.listen-address=127.0.0.1:9100
    --collector.disable-defaults --collector.cpu --collector.meminfo
    --collector.filesystem --collector.loadavg --collector.uname
user=node_exporter
autorestart=true
startretries=10
stdout_logfile=/var/log/node_exporter.log
stderr_logfile=/var/log/node_exporter.log

[program:openclaw-gateway]
command=/opt/openclaw/bin/openclaw gateway --port 18789 --bind loopback
user=openclaw
directory=/home/openclaw
environment=HOME="/home/openclaw",NODE_ENV="production"
autorestart=true
startretries=10
stdout_logfile=/var/log/openclaw-gateway.log
stderr_logfile=/var/log/openclaw-gateway.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2

[program:openclaw-studio]
command=/usr/bin/npm run start
directory=/openclaw-studio
environment=HOME="/root",NODE_ENV="production",HOST="127.0.0.1",PORT="3000"
autorestart=true
startretries=10
; Studio depends on the gateway — supervisord doesn't have a wait-for
; semantic, so the gateway either binds first (typical, since it's a
; small Node process and Studio's `next start` boot is heavier) or
; Studio gets ECONNREFUSED a couple of times on startup and reconnects
; once gateway is up.
stdout_logfile=/var/log/openclaw-studio.log
stderr_logfile=/var/log/openclaw-studio.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
